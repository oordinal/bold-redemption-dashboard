name: Sync redemptions

# Syncs new BOLD redemptions and publishes the dashboard data as a single commit on the
# `data` branch, which the Vercel site reads through the /data rewrite in vercel.json.
on:
  # Triggered every 30 minutes by an external scheduler (cron-job.org) through the workflow_dispatch API.
  # GitHub's own schedule is only a backup, twice a day (00:07 and 12:07 UTC, off the top of the hour,
  # where GitHub delays or drops fewer runs), in case the external scheduler stops.
  schedule:
    - cron: '7 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A full rescan (first run, or after SCAN_VERSION changes) takes about 15–20 minutes
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore the database from the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:database.sqlite > database.sqlite || rm -f database.sqlite
          else
            echo "No data branch yet: running a full sync from the V2 launch block"
          fi

      - name: Sync and export
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node export.js out

      - name: Publish to the data branch
        working-directory: out
        run: |
          git init -q -b data
          # The snapshot is several MB; a larger buffer avoids HTTP 400 on chunked uploads
          git config http.postBuffer 157286400
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
